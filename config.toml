[params.ai]
  enable = true
  iconUrl = "/assets/images/favicon4.png"  # 旧版兼容字段：未单独配置时，buttonIconUrl / panelIconUrl 会回退到这里
  buttonIconUrl = "/assets/images/favicon4.png"  # 右下角 AI 按钮图标，支持绝对 URL、/assets/... 或 Font Awesome 类名
  panelIconUrl = "/assets/images/favicon4.png"  # AI 面板头部/欢迎区图标，支持绝对 URL、/assets/... 或 Font Awesome 类名
  panelHeaderTitle = "AI助手"
  # 聊天气泡头像：支持绝对 URL 或 /assets/...；留空时使用默认贴纸头像
  assistantAvatarUrl = ""  # AI 回复头像图片
  userAvatarUrl = ""  # 用户消息头像图片
  assistantAvatarLabel = "AI"  # 未配置 AI 头像图时显示的默认文字
  userAvatarLabel = "ME"  # 未配置用户头像图时显示的默认文字
  apiUrl = ""
  apiKey = ""
  model = ""
  mcpUrl = "https://你的后端地址/mcp"
  mcpSearchUrl = "https://你的后端地址/api/search"
  enableMcp = true
  enableLocalSearch = true
  searchMode = "local"
  enableThinking = true
  maxTokens = 4096
  temperature = 0.7
  systemPrompt = "你是 NOISE导航 的AI助手，帮助用户搜索和了解站内收录的网站资源。当用户询问网站推荐或工具时，优先使用搜索站内数据给出精准回答。回答应简洁有用，包含网站名称、链接和简要说明。"
  placeholder = "输入问题，搜索站内资源..."
  welcomeTitle = "NOISE AI 助手"
  welcomeText = """你好！我是NOISE导航的AI助手，可以帮你搜索站内收录的资源

试试问我：
• 有什么好用的AI工具？
• 推荐一些剪辑工具网站"""
  [[params.ai.welcomeTips]]
    label = "AI工具推荐"
    q = "有什么好用的AI工具？"
  [[params.ai.welcomeTips]]
    label = "剪辑工具"
    q = "推荐一些剪辑工具网站"
  [[params.ai.welcomeTips]]
    label = "运营工具"
    q = "搜索运营工具资源"
  [[params.ai.welcomeTips]]
    label = "影视资源"
    q = "有哪些影视资源网站？"

