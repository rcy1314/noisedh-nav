<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <!-- Content-Security-Policy (CSP)：限制页面脚本/样式/图片等资源的加载来源（默认仅允许同源），用于降低 XSS 等风险 -->
    <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' https: data: blob:; style-src 'self' 'unsafe-inline' https:; script-src 'self' 'unsafe-inline' https://sdk.51.la https://cdn.jsdelivr.net https://cdn.staticfile.org https://busuanzi.ibruce.info; connect-src 'self' https:; font-src 'self' https: data:; media-src 'self' https:; worker-src 'self' blob:;"> -->
    <meta name="google-adsense-account" content="{{ .Site.Params.seo.googleAdsenseAccount }}">
    <meta name="description" content="{{ .Site.Params.description }}">
    <meta name="keywords" content="{{ .Site.Params.keywords }}">
    <meta itemprop="image" content="{{ .Site.Params.og_image }}" />
    <!-- Open Graph tags -->
    <meta property="og:title" content="{{ .Site.Params.og_title }}" />
    <meta property="og:description" content="{{ .Site.Params.og_description }}" />
    <meta property="og:image" content="{{ .Site.Params.og_image }}" />
    <meta property="og:url" content="{{ .Site.Params.og_url }}" />
    <meta property="og:type" content="website" />
    
    <!-- Twitter Card tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ .Site.Params.twitter_title }}" />
    <meta name="twitter:description" content="{{ .Site.Params.twitter_description }}" />
    <meta name="twitter:image" content="{{ .Site.Params.twitter_image }}" />
    
   <!-- Open Graph tags for WeChat sharing -->
    <meta property="og:title" content="{{ .Site.Params.og_title }}" />
    <meta property="og:description" content="{{ .Site.Params.og_description }}" />
    <meta property="og:image" content="{{ .Site.Params.og_image }}" />
    <meta property="og:url" content="{{ .Site.Params.og_url }}" />
    <meta property="og:type" content="website" />
    
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1">

    <meta name="theme-color" content="#f9f9f9">
    <title>{{ .Site.Title }}</title>
    <!-- 网站版本号，用于 Service Worker 检测更新 -->
    <meta name="site-version" content="{{ now.Unix }}">
    <link rel="shortcut icon" href="{{ $.Site.Params.images.favicon }}">
    <meta name="keywords" content="{{ .Site.Title }}">
    <meta name="baidu-site-verification" content="{{ .Site.Params.seo.baiduSiteVer | default "code-ERzo5lqNbW" }}" />
    <meta name="sogou_site_verification" content="c5kms0qkyL"/>
    <meta name="360-site-verification" content="fcc13eac55051e381be8a06453359bc1" />
    {{ $assetVer := $.Site.Params.assetVersion | default $.Site.Params.assetsVersion | default (now.Unix) }}
    <link rel='stylesheet' id='iconfont-css' href='{{ $.Site.Params.siteurl }}/assets/css/iconfont-3.03029.1.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel='stylesheet' id='bootstrap-css' href='{{ $.Site.Params.siteurl }}/assets/css/bootstrap.min-4.3.1.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel='stylesheet' id='iowen-css' href='{{ $.Site.Params.siteurl }}/assets/css/styles.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel='stylesheet' id='loading-css' href='{{ $.Site.Params.siteurl }}/assets/css/loading.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel='stylesheet' id='custom-css' href='{{ $.Site.Params.siteurl }}/assets/css/custom-style.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel='stylesheet' id='sticker-theme-css' href='{{ $.Site.Params.siteurl }}/assets/css/sticker-theme.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel='stylesheet' id='APlayer.min-css' href='{{ $.Site.Params.siteurl }}/assets/css/APlayer.min.css?v={{ $assetVer }}' type='text/css' media='all'>
    <link rel="stylesheet" id="fortawesome-css" href="{{ $.Site.Params.siteurl }}/assets/fontawesome-5.15.4/css/all.min.css?v={{ $assetVer }}" type="text/css">
    <link rel="stylesheet" id="fortawesome-v4shims-css" href="{{ $.Site.Params.siteurl }}/assets/fontawesome-5.15.4/css/v4-shims.min.css?v={{ $assetVer }}" type="text/css">
    <script defer type='text/javascript' src='{{ $.Site.Params.siteurl }}/assets/js/jquery.min.js?v={{ $assetVer }}' id='jquery-js'></script>
    <!-- 添加Service Worker -->
    <script>
        (function() {
            var currentVersion = document.querySelector('meta[name="site-version"]');
            currentVersion = currentVersion ? currentVersion.getAttribute('content') : '';
            
            // 延迟注册Service Worker
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('service-worker.js?v={{ $assetVer }}', {
                    scope: '/',
                    updateViaCache: 'none'
                }).catch(console.error);
            }
        })();
    </script>
     <link rel="manifest" href="manifest.json">
     <!-- 引入热榜 -->
     <link rel="stylesheet" href="{{ $.Site.Params.siteurl }}/assets/css/hot.css?v={{ $assetVer }}">
     <script defer src="{{ $.Site.Params.siteurl }}/assets/js/hot.js?v={{ $assetVer }}"></script>
    <script>
        (function() {
            function closeAll(menu) {
                menu.querySelectorAll('li.menu-item-has-children.focus').forEach(function(li) {
                    li.classList.remove('focus');
                    var a = li.querySelector('a[aria-expanded]');
                    if (a) a.setAttribute('aria-expanded', 'false');
                });
            }

            document.addEventListener('click', function(event) {
                var menu = document.querySelector('.content-header-menu');
                if (!menu) return;

                var toggle = event.target.closest('.content-header-menu li.menu-item-has-children > a.content-header-toggle');
                if (toggle) {
                    event.preventDefault();
                    var li = toggle.parentElement;
                    var willOpen = !li.classList.contains('focus');
                    closeAll(menu);
                    if (willOpen) {
                        li.classList.add('focus');
                        toggle.setAttribute('aria-expanded', 'true');
                    } else {
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                    return;
                }

                if (!event.target.closest('.content-header-menu')) {
                    closeAll(menu);
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key !== 'Escape') return;
                var menu = document.querySelector('.content-header-menu');
                if (!menu) return;
                closeAll(menu);
            });
        })();
    </script>
</head>
