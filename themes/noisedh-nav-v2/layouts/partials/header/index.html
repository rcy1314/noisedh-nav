    <!-- 添加Service Worker -->
    <script>
        // 延迟注册Service Worker
        if ('serviceWorker' in navigator) {
            const registerServiceWorker = function() {
                navigator.serviceWorker.register('service-worker.js?v={{ $assetVer }}', {
                    scope: '/',
                    updateViaCache: 'none'
                }).catch(console.error);

                // 监听 Service Worker 消息，收到刷新指令时强制刷新页面
                navigator.serviceWorker.addEventListener('message', function(event) {
                    if (event.data && event.data.type === 'refresh') {
                        window.location.reload(true);
                    }
                });
            };
            if ('requestIdleCallback' in window) {
                requestIdleCallback(registerServiceWorker, { timeout: 5000 });
            } else {
                setTimeout(registerServiceWorker, 2000);
            }
        }
    </script>
     <link rel="manifest" href="manifest.json">
     <!-- 引入热榜 -->
     <link rel="stylesheet" href="{{ $.Site.Params.siteurl }}/assets/css/hot.css?v={{ $assetVer }}">
     <script defer src="{{ $.Site.Params.siteurl }}/assets/js/hot.js?v={{ $assetVer }}"></script>
    <script>
        (function() {
            function closeAll(menu) {
                menu.querySelectorAll('li.menu-item-has-children.focus').forEach(function(li) {
                    li.classList.remove('focus');
                    var a = li.querySelector('a[aria-expanded]');
                    if (a) a.setAttribute('aria-expanded', 'false');
                });
            }

            document.addEventListener('click', function(event) {
                var menu = document.querySelector('.content-header-menu');
                if (!menu) return;

                var toggle = event.target.closest('.content-header-menu li.menu-item-has-children > a.content-header-toggle');
                if (toggle) {
                    event.preventDefault();
                    var li = toggle.parentElement;
                    var willOpen = !li.classList.contains('focus');
                    closeAll(menu);
                    if (willOpen) {
                        li.classList.add('focus');
                        toggle.setAttribute('aria-expanded', 'true');
                    } else {
                        toggle.setAttribute('aria-expanded', 'false');
                    }
                    return;
                }

                if (!event.target.closest('.content-header-menu')) {
                    closeAll(menu);
                }
            });

            document.addEventListener('keydown', function(event) {
                if (event.key !== 'Escape') return;
                var menu = document.querySelector('.content-header-menu');
                if (!menu) return;
                closeAll(menu);
            });
        })();
    </script>
</head>
