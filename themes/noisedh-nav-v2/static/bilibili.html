<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOISE-B站播放器</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100%;
        }

        body {
            background: transparent;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #000;
        }

        .center-message {
            position: absolute;
            left: 50%;
            top: 10px;
            transform: translateX(-50%) rotate(-1.4deg);
            display: none;
            max-width: min(520px, 92vw);
            padding: 12px 14px 12px 14px;
            border-radius: 16px;
            border: 2px dashed rgba(255, 255, 255, 0.28);
            background:
                radial-gradient(circle at 12% 18%, rgba(255, 228, 150, 0.22), transparent 54%),
                radial-gradient(circle at 86% 26%, rgba(170, 210, 255, 0.18), transparent 56%),
                rgba(12, 16, 28, 0.72);
            color: rgba(242, 246, 255, 0.94);
            font-size: 14px;
            line-height: 1.6;
            font-weight: 700;
            letter-spacing: 0.01em;
            box-shadow:
                0 18px 38px rgba(0, 0, 0, 0.32),
                8px 8px 0 rgba(0, 0, 0, 0.22);
            backdrop-filter: none;
            z-index: 11;
        }

        .center-message::before {
            content: "";
            position: absolute;
            top: -10px;
            left: 14px;
            width: 74px;
            height: 22px;
            border-radius: 8px;
            transform: rotate(-6deg);
            background: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 10px 22px rgba(0, 0, 0, 0.26);
            pointer-events: none;
        }

        .center-message::after {
            content: "";
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 0 0 18px 18px;
            border-color: transparent transparent rgba(255, 255, 255, 0.18) transparent;
            pointer-events: none;
        }

        .close-button {
            position: absolute;
            right: 10px;
            top: 10px;
            width: 28px;
            height: 28px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(13, 17, 30, 0.56);
            color: rgba(242, 246, 255, 0.92);
            cursor: pointer;
            font-size: 16px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .message-text {
            display: block;
            padding-right: 34px;
        }

        .message-text strong {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 900;
        }

        .message-text strong::before {
            content: "";
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: rgba(255, 226, 114, 0.9);
            box-shadow: 0 0 0 4px rgba(255, 226, 114, 0.18);
        }

        .control-button {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            padding: 0;
            border-radius: 11px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: linear-gradient(180deg, rgba(52, 62, 84, 0.92), rgba(13, 17, 30, 0.92));
            color: rgba(242, 246, 255, 0.92);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease, filter 0.2s ease;
            z-index: 10;
            pointer-events: none;
            box-shadow:
                0 16px 34px rgba(0, 0, 0, 0.32),
                inset 0 1px 0 rgba(255, 255, 255, 0.12);
        }

        .control-button span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
        }

        .control-button svg {
            width: 18px;
            height: 18px;
            fill: rgba(242, 246, 255, 0.92);
        }

        .prev-button {
            left: 8px;
        }

        .next-button {
            right: 8px;
        }

        body:hover .control-button {
            opacity: 1;
            filter: brightness(1.06);
            pointer-events: auto;
        }

        .control-button:active {
            transform: translateY(calc(-50% + 1px));
            filter: brightness(0.98);
        }

        .control-button:focus-visible {
            opacity: 1;
            pointer-events: auto;
            outline: none;
        }

        @media (hover: none), (pointer: coarse) {
            .control-button {
                opacity: 1;
                pointer-events: auto;
            }
        }
    </style>
</head>

<body>
    <iframe name="player" allowfullscreen allow="autoplay; fullscreen; picture-in-picture; encrypted-media"></iframe>

    <button class="control-button prev-button" onclick="playPreviousVideo()" aria-label="上一条">
        <span aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M6 5h2v14H6zM19 6v12l-9-6z"></path>
            </svg>
        </span>
    </button>
    <button class="control-button next-button" onclick="playRandomVideo()" aria-label="下一条">
        <span aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M16 5h2v14h-2zM5 6v12l9-6z"></path>
            </svg>
        </span>
    </button>

    <div class="center-message" id="centerMessage" role="status" aria-live="polite">
        <span class="close-button" onclick="closeMessage()" aria-label="关闭提示">×</span>
        <span class="message-text"><strong>提示</strong> 正在载入视频…</span>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mediaId = urlParams.get('id');
        // 默认不自动播放：自动播放会触发浏览器的静音策略，表现为“播放器没声音”。
        // 只有显式传入 autoplay=1 才自动播放并在结束后切换下一个。
        const autoplayEnabled = urlParams.get('autoplay') === '1';
        const proxyBase = String(urlParams.get('proxy') || '').replace(/\/+$/, '');
        const playerFrame = document.querySelector('iframe');
        const messageBox = document.getElementById('centerMessage');
        const messageText = messageBox ? messageBox.querySelector('.message-text') : null;

        // 兜底片单：任何一个取数通道都不可用时，播这里，保证播放器永远有内容。
        // 取自媒体库 3271958393 的收藏（已通过 /x/web-interface/view 校验可播放），
        // 旧的 BV1eJ411D7q9 等条目已失效（62002 稿件不可见），会显示"无法正常播放"。
        const FALLBACK_BVIDS = [
            'BV1S7Nw6TEp6', 'BV1vh5665EA3', 'BV1URRiBXEyk', 'BV1XxX1B2E8L',
            'BV1q8411u7os', 'BV1Q5sNzyE9J', 'BV1pHHxzSECc', 'BV1Ro4yzKE5G',
            'BV15jHpz4Et4', 'BV18V4y1M7PM', 'BV1ki4y1g7H7', 'BV1Nh41117hy',
            'BV19f421Q7dV', 'BV1wupvzCEG5', 'BV1mmahzYESC', 'BV1dqHqzMEEe',
            'BV1faYrz7EPy', 'BV1XZarziEMG', 'BV1evEWzHExR', 'BV1E3a1zsEGJ',
            'BV1TpazzXEmb', 'BV1GKu4ziEfJ', 'BV1ezKSzhER8', 'BV1mG3jzBEbm',
            'BV1n2jqzeECP', 'BV1M4gDzPECu', 'BV1TNK3z3Ea1', 'BV1K2421T7Ue',
            'BV1Sz421D7Ef', 'BV14Q4y1w7mg', 'BV1bk4y1X7iA', 'BV11D9VY9EsA',
            'BV1Ce4y1X76m', 'BV1vj411V7Hx', 'BV1mvmiYrEaZ', 'BV18HGQzVECP',
            'BV1LcoKYdEr3', 'BV1JuojYcEfA', 'BV1F8L8zuEP1', 'BV1xmVszeER4'
        ];
        const FETCH_TIMEOUT = 7000;

        let showMessage = true;
        let playedVideos = [];
        let currentVideoIndex = -1;
        let timerId = null;
        let cachedBvids = [];
        let loadingGuard = null;
        const cacheKey = mediaId ? `ndh_bili_fav_${mediaId}` : '';
        const FALLBACK_KEY = 'ndh_bili_fallback';

        function readCache() {
            if (!cacheKey) return null;
            try {
                const raw = localStorage.getItem(cacheKey);
                if (!raw) return null;
                const payload = JSON.parse(raw);
                if (!payload || !Array.isArray(payload.bvids)) return null;
                if (typeof payload.ts !== 'number') return null;
                if (Date.now() - payload.ts > 1000 * 60 * 60 * 6) return null;
                return payload.bvids.filter(Boolean);
            } catch (e) {
                return null;
            }
        }

        function writeCache(bvids) {
            if (!cacheKey) return;
            try {
                localStorage.setItem(cacheKey, JSON.stringify({ ts: Date.now(), bvids: bvids.slice(0, 80) }));
            } catch (e) {
            }
        }

        function readFallback() {
            try {
                const raw = localStorage.getItem(FALLBACK_KEY);
                if (!raw) return FALLBACK_BVIDS.slice();
                const list = JSON.parse(raw);
                return Array.isArray(list) && list.length ? list.filter(Boolean) : FALLBACK_BVIDS.slice();
            } catch (e) {
                return FALLBACK_BVIDS.slice();
            }
        }

        function setMessage(visible, text) {
            if (!messageBox) return;
            messageBox.style.display = visible && showMessage ? 'block' : 'none';
            if (text && messageText) messageText.innerHTML = `<strong>提示</strong> ${text}`;
        }

        function closeMessage() {
            showMessage = false;
            setMessage(false);
        }

        function iframeLoaded() {
            if (!playerFrame) return;
            // onload 也会在 about:blank 时触发，只有真正加载了播放器才收起提示
            if (!playerFrame.src || playerFrame.src.indexOf('player.bilibili.com') === -1) return;
            if (loadingGuard) {
                clearTimeout(loadingGuard);
                loadingGuard = null;
            }
            setMessage(false);
        }

        if (playerFrame) {
            playerFrame.addEventListener('load', iframeLoaded);
        }

        function fetchJson(url, timeout) {
            const controller = typeof AbortController === 'function' ? new AbortController() : null;
            const ms = timeout || FETCH_TIMEOUT;
            const timer = controller ? setTimeout(() => controller.abort(), ms) : null;
            const opts = controller ? { cache: 'no-store', signal: controller.signal } : { cache: 'no-store' };
            return fetch(url, opts)
                .then(response => {
                    if (!response.ok) throw new Error('http_' + response.status);
                    return response.json();
                })
                .then(data => {
                    if (timer) clearTimeout(timer);
                    return data;
                })
                .catch(err => {
                    if (timer) clearTimeout(timer);
                    throw err;
                });
        }

        // 同时向多个通道发起请求，谁先成功用谁；全部失败才进入兜底
        function fetchFirst(urls, transform) {
            const tasks = urls.filter(Boolean).map(url =>
                fetchJson(url).then(data => {
                    const value = transform ? transform(data) : data;
                    if (!value) throw new Error('empty');
                    return value;
                })
            );
            if (!tasks.length) return Promise.reject(new Error('no_source'));
            if (typeof Promise.any === 'function') {
                return Promise.any(tasks);
            }
            return new Promise((resolve, reject) => {
                let failed = 0;
                tasks.forEach(task => task.then(resolve).catch(() => {
                    failed += 1;
                    if (failed === tasks.length) reject(new Error('all_failed'));
                }));
            });
        }

        function favSources() {
            const api = `https://api.bilibili.com/x/v3/fav/resource/ids?media_id=${encodeURIComponent(mediaId)}`;
            const list = [];
            if (proxyBase) list.push(`${proxyBase}/fav?media_id=${encodeURIComponent(mediaId)}`);
            list.push(`https://api.allorigins.win/raw?url=${encodeURIComponent(api)}`);
            // 直连 api.bilibili.com 不会有 CORS 头，浏览器必然失败，因此不做尝试
            return list;
        }

        function viewSources(bvid) {
            const api = `https://api.bilibili.com/x/web-interface/view?bvid=${encodeURIComponent(bvid)}`;
            const list = [];
            if (proxyBase) list.push(`${proxyBase}/view?bvid=${encodeURIComponent(bvid)}`);
            list.push(`https://api.allorigins.win/raw?url=${encodeURIComponent(api)}`);
            return list;
        }

        function extractBvids(payload) {
            if (!payload || !payload.data) return [];
            const data = payload.data;
            if (Array.isArray(data)) return data.map(item => item && (item.bvid || item.bv_id)).filter(Boolean);
            if (data.medias && Array.isArray(data.medias)) return data.medias.map(item => item && (item.bvid || item.bv_id)).filter(Boolean);
            if (data.list && Array.isArray(data.list)) return data.list.map(item => item && (item.bvid || item.bv_id)).filter(Boolean);
            return [];
        }

        function scheduleNext(bvid) {
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            fetchFirst(viewSources(bvid), data => {
                const duration = data && data.data && typeof data.data.duration === 'number' ? data.data.duration : 0;
                return duration || 600;
            })
                .then(duration => {
                    const ms = Math.min(Math.max((duration + 6) * 1000, 60000), 30 * 60 * 1000);
                    timerId = setTimeout(playRandomVideo, ms);
                })
                .catch(() => {
                    timerId = setTimeout(playRandomVideo, 10 * 60 * 1000);
                });
        }

        function playBvid(bvid) {
            if (!playerFrame) return;
            if (timerId) {
                clearTimeout(timerId);
                timerId = null;
            }
            if (loadingGuard) clearTimeout(loadingGuard);
            setMessage(true, '正在载入视频…');
            playerFrame.src = `https://player.bilibili.com/player.html?isOutside=true&bvid=${encodeURIComponent(bvid)}&p=1&autoplay=${autoplayEnabled ? 1 : 0}&high_quality=1&danmaku=0`;
            // 播放器被墙/超时时给一句可操作的提示，而不是一直转圈
            loadingGuard = setTimeout(() => {
                loadingGuard = null;
                setMessage(true, '播放器加载较慢，可点右侧按钮换一个视频');
            }, 15000);
            if (autoplayEnabled) {
                scheduleNext(bvid);
            }
        }

        function playPreviousVideo() {
            if (currentVideoIndex <= 0) return;
            currentVideoIndex -= 1;
            playBvid(playedVideos[currentVideoIndex]);
        }

        function pickFrom(list) {
            let candidates = list.filter(bvid => !playedVideos.includes(bvid));
            if (!candidates.length) {
                playedVideos = [];
                currentVideoIndex = -1;
                candidates = list.slice();
            }
            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            playedVideos.push(chosen);
            currentVideoIndex = playedVideos.length - 1;
            playBvid(chosen);
        }

        function playRandomVideo() {
            if (!mediaId) {
                playFallbackList('缺少参数：id（mediaId），先播放内置片单');
                return;
            }

            if (!cachedBvids.length) {
                const fromCache = readCache();
                if (fromCache && fromCache.length) cachedBvids = fromCache;
            }

            if (cachedBvids.length) {
                pickFrom(cachedBvids);
                return;
            }

            setMessage(true, '正在获取收藏列表…');

            fetchFirst(favSources(), data => {
                const bvids = extractBvids(data);
                if (!bvids.length) throw new Error('empty');
                return bvids;
            })
                .then(bvids => {
                    cachedBvids = bvids.slice();
                    writeCache(cachedBvids);
                    pickFrom(cachedBvids);
                })
                .catch(() => {
                    playFallbackList();
                });
        }

        function playFallbackList(note) {
            const list = readFallback();
            if (!list.length) {
                setMessage(true, '加载失败，请刷新或更换网络/地区');
                return;
            }
            if (note) setMessage(true, note);
            pickFrom(list);
        }

        playRandomVideo();
    </script>
</body>
</html>
