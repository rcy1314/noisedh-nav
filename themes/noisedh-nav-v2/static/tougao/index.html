<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noise导航投稿区</title>
    <link rel="icon" href="../assets/images/favicon4.png">
    <link rel="apple-touch-icon" href="../assets/images/favicon.png">
    <link rel="stylesheet" href="./style.css">
    <style>
        :root {
            --paper: rgba(255, 253, 242, 0.96);
            --paper-2: rgba(255, 255, 255, 0.92);
            --ink: rgba(22, 24, 35, 0.92);
            --muted: rgba(22, 24, 35, 0.68);
            --line: rgba(22, 24, 35, 0.12);
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
            --shadow-2: 0 10px 0 rgba(22, 24, 35, 0.1);
            --tape: rgba(255, 255, 255, 0.62);
            --tape-line: rgba(22, 24, 35, 0.12);
            --accent: #4f8cff;
            --accent-2: #745fff;
        }

        html,
        body {
            padding: 0;
            height: 100%;
            color: var(--ink);
            font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
        }

        body {
            max-width: 700px;
            margin: 0 auto;
        }

        .background {
            position: fixed; /* 使用fixed确保背景图固定 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            filter: blur(10px) saturate(1.08) contrast(0.92); /* 背景模糊效果 */
            transform: scale(1.05);
            z-index: 0; /* 确保背景在最底层 */
        }

        .container {
            position: relative; /* 确保内容在背景之上 */
            z-index: 1; /* 确保内容在背景之上 */
            max-width: 800px; /* 设置最大宽度 */
            width: calc(100% - 32px);
            padding: 22px 22px 18px;
            background: linear-gradient(180deg, var(--paper), var(--paper-2));
            border-radius: 18px 18px 16px 20px;
            border: 2px solid var(--line);
            box-shadow: var(--shadow), var(--shadow-2);
            margin: 50px auto 22px;
            transform: none;
        }

        .container:before,
        .container:after {
            content: '';
            position: absolute;
            top: -14px;
            width: 92px;
            height: 28px;
            border-radius: 10px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.46));
            border: 1px solid var(--tape-line);
            box-shadow: 0 10px 26px rgba(0, 0, 0, 0.16);
            filter: blur(0.1px);
            pointer-events: none;
        }

        .container:before {
            left: 18px;
            transform: none;
        }

        .container:after {
            right: 18px;
            transform: none;
        }

        .box-1 svg {
            display: block;
            margin: 0 auto 6px;
            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.16));
        }

        .box-1 h2 {
            margin: 6px 0 10px;
            font-size: 22px;
            letter-spacing: 0.3px;
            text-align: center;
            color: rgba(22, 24, 35, 0.94);
        }

        .box-1 p {
            margin: 0;
            color: var(--muted);
            line-height: 1.75;
        }

        .recent-sites {
            margin-top: 20px;
            padding: 14px 14px 10px;
            background: rgba(255, 255, 255, 0.82);
            border-radius: 16px 14px 18px 14px;
            border: 2px dashed rgba(22, 24, 35, 0.14);
            box-shadow: 0 16px 34px rgba(0, 0, 0, 0.14), 0 10px 0 rgba(22, 24, 35, 0.08);
            text-align: center; /* 内容居中 */
            transform: none;
        }

        .recent-sites h3 {
            margin: 4px 0 10px;
            font-size: 15px;
            letter-spacing: 0.2px;
            color: rgba(22, 24, 35, 0.86);
        }

        #site-list {
            max-height: 150px; /* 设置最大高度 */
            overflow-y: auto; /* 允许纵向滚动 */
            list-style-type: none; /* 去掉默认的列表样式 */
            padding: 0; /* 去掉内边距 */
            margin: 0; /* 去掉外边距 */
        }

        #site-list li {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(22, 24, 35, 0.08);
        }

        #site-list li:last-child {
            border-bottom: none; /* 最后一项去掉下边框 */
        }

        #site-list a {
            text-decoration: none; /* 去掉链接下划线 */
            color: rgba(22, 24, 35, 0.92);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            border: 1px solid rgba(22, 24, 35, 0.14);
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.08);
        }

        #site-list a:hover {
            border-color: rgba(79, 140, 255, 0.3);
            transform: translateY(-1px);
        }

        #site-list a:active {
            transform: translateY(1px);
        }

        .gradient-link {
            background: linear-gradient(90deg, var(--accent-2), var(--accent));
            -webkit-background-clip: text;
            color: transparent;
            text-decoration: none;
            font-size: 16px;
            font-weight: 700;
        }

        .gradient-link:hover {
            filter: saturate(1.1);
        }

    </style>
    </head>
    
    <body>
        <div class="background" id="background"></div> <!-- 背景图层 -->
        <div class="container">
            <div class="box-1">
                <svg width='52' xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
                    <path fill='#080808'
                        d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64zm227 385.3c-1 4.2-3.5 10.4-7 17.8h.1l-.4.7c-20.3 43.1-73.1 127.7-73.1 127.7s-.1-.2-.3-.5l-15.5 26.8h74.5L575.1 810l32.3-128h-58.6l20.4-84.7c-16.5 3.9-35.9 9.4-59 16.8 0 0-31.2 18.2-89.9-35 0 0-39.6-34.7-16.6-43.4 9.8-3.7 47.4-8.4 77-12.3 40-5.4 64.6-8.2 64.6-8.2S422 517 392.7 512.5c-29.3-4.6-66.4-53.1-74.3-95.8 0 0-12.2-23.4 26.3-12.3 38.5 11.1 197.9 43.2 197.9 43.2s-207.4-63.3-221.2-78.7c-13.8-15.4-40.6-84.2-37.1-126.5 0 0 1.5-10.5 12.4-7.7 0 0 153.3 69.7 258.1 107.9 104.8 37.9 195.9 57.3 184.2 106.7z">
                    </path>
                </svg>
            <h2>
                Noise导航投稿区
            </h2>
            <p>这里是静态化的评论区，你可以投稿收录网址或提出建议反馈，【申请时请按格式提交】刷新页面或清理缓存查看最新留言，收录原则：定期维护网站，不接受存在时间过短及三分钟热度的网站收录，不收录无意义无价值网站，Does not include meaningless.由于页面数据过多，本页面无邮件通知，如需及时通知反馈可在我的主页留言提交收录👉<a href="https://www.noisework.cn" target="_blank" rel="noopener noreferrer">
                <span class="gradient-link">前往主页</span>
              </a>
              </p>
        </div>
        
        <!-- 最近收录的站点 -->
        <div class="recent-sites">
            <h3>最近收录的站点（40条）</h3>
            <ul id="site-list">
                <!-- 动态添加网站数据 -->
            </ul>
        </div>
        
        <div class="vcomment"></div>
    </div>
    
    <script src="./Valine.min.js"></script>
    <script src="./data.js"></script>
    
    <script>
        // 使用 fetch 请求 API 获取最近收录的网站数据
        async function fetchRecentSites() {
            try {
                const response = await fetch('https://extension.noisework.cn/api/notifications'); // 替换为您的 API 地址
                if (!response.ok) {
                    throw new Error('网络响应不正常');
                }
                const data = await response.json();
                displaySites(data);
            } catch (error) {
                console.error('获取数据时出错:', error);
            }
        }

        function displaySites(data) {
            const siteListElement = document.getElementById('site-list');
            siteListElement.innerHTML = ''; // 清空列表

            if (data.message) {
                const messageItem = document.createElement('li');
                messageItem.textContent = data.message;
                siteListElement.appendChild(messageItem);
                return;
            }

            data.forEach(site => {
                const listItem = document.createElement('li');
                listItem.innerHTML = `<a href="${site.url}" target="_blank">${site.title}</a>`;
                siteListElement.appendChild(listItem);
            });
        }

        // 页面加载时获取最近收录的网站数据
        window.onload = fetchRecentSites;

        // 背景图数组
        const backgroundImages = [
            './img/bg1.webp',
            './img/bg2.webp',
            './img/bg3.webp',
            './img/bg4.webp',
            './img/bg6.webp',
        ];

        // 随机更换背景图
        function changeBackground() {
            const randomIndex = Math.floor(Math.random() * backgroundImages.length);
            document.getElementById('background').style.backgroundImage = `url('${backgroundImages[randomIndex]}')`;
        }

        // 初始化背景图
        changeBackground();
    </script>
</body>

</html>
